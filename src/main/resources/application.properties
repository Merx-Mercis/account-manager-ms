server.port=${PORT}
server.servlet.context-path=/account-manager-ms

#Microservice
ms.x-application-id=${X_APPLICATION_ID}
ms.x-api-key=${X_API_KEY}

#Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?socketTimeout=30
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#Migration
spring.flyway.enabled=true
spring.flyway.baseline-version=1
spring.flyway.schemas=public
spring.flyway.table=_flyway_schema_history
spring.flyway.locations=classpath:db/migration
spring.flyway.sql-migration-prefix=V
spring.flyway.baseline-on-migrate=true

